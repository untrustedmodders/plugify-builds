# release-please opens a release PR from conventional commits; merging it creates the stable release
# plugify-source2-vX.Y.Z, which is built and published by build.yml.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs['builds/source2--release_created'] }}
      tag: ${{ steps.rp.outputs['builds/source2--tag_name'] }}
      version: ${{ steps.rp.outputs['builds/source2--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: write
      pages: write
      id-token: write
      attestations: write
    secrets: inherit
